<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4a7c59" />
  <title>elei</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>

<body>
  <div id="map"></div>

  <!-- Los componentes se montan desde src/main.ts -->
  <elei-search-panel id="searchPanel"></elei-search-panel>
  <elei-fab id="addCafeBtn" hidden>+ Agregar cafetería</elei-fab>
  <div id="centerPin" hidden>
    <div class="pinHead"></div>
    <div class="pinStick"></div>
    <div class="pinShadow"></div>
  </div>
  <elei-place-bar id="placeBar" hidden></elei-place-bar>
  <elei-cafe-modal id="cafeModal" hidden></elei-cafe-modal>
  <elei-user-badge id="userBadge" hidden></elei-user-badge>
  <elei-login-screen id="loginScreen"></elei-login-screen>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
